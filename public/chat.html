<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
    <aside class="sidebar">
        <div class="sidebar-top">
            <span>My Chat</span>
            <button onclick="logout()">Logout</button>
        </div>

        <p id="my-username"></p> <!-- logged in username -->

        <!-- Rooms -->
        <h4>ROOMS</h4>
        <button onclick="showCreateRoom()">+ New Room</button>
        <div id="create-room-box" class="hidden">
            <input type="text" id="room-name-input" placeholder="room-name" maxlength="30">
            <button onclick="createRoom()">Create</button>
        </div>

        <!-- Empty room list (until fetched) -->
        <ul id="room-list"></ul>

        <!-- Empty user lists (until fetched) -->
        <h4>DIRECT MESSAGE</h4>
        <ul id="user-list"></ul>
    </aside>

    <main class="chat-area">
        <div class="chat-header">
            <span id="chat-title">Select a room or person</span>
        </div>

        <div id="messages"></div> <!-- Messages get added here by Javascript -->

        <div class="input-row">
            <input type="text" id="msg-input" placeholder="Type a message..." disabled >
            <button id="send-btn" onclick="sendMessage()" disabled >Send</button>
        </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>
</html>
